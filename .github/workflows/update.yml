name: Update profile

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs and project cards
        run: python scripts/generate.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh profile assets"
          git push
