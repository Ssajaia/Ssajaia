name: Update profile assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/generate.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile SVGs
        run: python scripts/generate.py

      - name: Commit updated SVGs
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add assets/hero-dark.svg assets/hero-light.svg assets/stack-dark.svg assets/stack-light.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile SVGs"
          git push
